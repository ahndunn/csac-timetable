[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
chrono = { version = "0.4", features = ["serde"] }
csac-common = { path = "../../crates/common" }
csac-kafka-events = { path = "../../crates/kafka-events" }
csac-proto = { path = "../../crates/proto" }
rdkafka = { version = "0.37", features = ["tokio"] }
redis = { version = "0.27", features = ["tokio-comp", "json", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
