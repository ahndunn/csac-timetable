[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
csac-proto = { path = "../../crates/proto" }
csac-common = { path = "../../crates/common" }
csac-kafka-events = { path = "../../crates/kafka-events" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tonic = "0.12"
rdkafka = { version = "0.37", features = ["tokio"] }
redis = { version = "0.27", features = ["tokio-comp"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
