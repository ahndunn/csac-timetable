[package]
name = "csac-notification-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
csac-common = { path = "../../crates/common" }
csac-kafka-events = { path = "../../crates/kafka-events" }
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "builder", "smtp-transport"] }
rdkafka = { version = "0.37", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
